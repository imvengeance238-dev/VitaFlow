name: Build VitaFlow APK

on:
  workflow_dispatch:
  push:
    paths:
      - "VitaFlow-phase5.zip"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$(find "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found on the runner."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Extract project ZIP
        run: |
          test -f VitaFlow-phase5.zip
          unzip -q VitaFlow-phase5.zip -d extracted
          PROJECT_DIR="$(find extracted -mindepth 1 -maxdepth 2 -name settings.gradle.kts -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "Could not locate settings.gradle.kts inside the uploaded ZIP."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Prepare KSP configuration
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          sed -i '/^ksp\.useKSP2=false$/d' gradle.properties || true
          echo "Using the KSP2 default for Kotlin 2.1."

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Generate signing report
        if: always()
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon :app:signingReport || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VitaFlow-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
